<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💖 Jour 14 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Georgia", serif;
      background: linear-gradient(135deg, #fdfcfb, #e2d1c3);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100%;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 2rem;
      color: #2d2d2d;
      margin-bottom: 1rem;
      margin-top: 1.6rem;
    }

    h2 {
      font-family: "Georgia", serif;
      font-size: 1.2rem;
      color: #2d2d2d;
      margin-top: 1.5rem;
      margin-bottom: -5rem;
      margin-inline: 1rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* justify-content: first baseline; */
      padding: 1rem;
    }

    .question-box {
      width: 90%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.8);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .question-box.active {
      opacity: 1;
      transform: translateY(0);
    }

    .question {
      font-size: 1.3rem;
      font-style: italic;
      margin-bottom: 1rem;
      color: #444;
    }

    .options {
      text-align: left;
      margin-bottom: 1rem;
    }

    .options label {
      display: block;
      margin: 0.5rem 0;
      cursor: pointer;
    }

    .answer {
      font-size: 1rem;
      color: #333;
      margin-top: 0.8rem;
      font-style: italic;
    }

    button {
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #f2e0d0;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, background 0.2s;
      margin-top: 0.5rem;
    }

    button:hover {
      transform: scale(1.05);
      background: #e6cbb7;
    }

    .result {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .result img {
      max-width: 80%;
      border-radius: 10px;
      margin-bottom: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .score {
      font-size: 1rem;
      font-weight: bold;
      color: #2d2d2d;
      margin-top: 1rem;
    }

    footer {
      font-size: 0.85rem;
      color: #666;
      padding: 1rem;
      text-align: center;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.6);
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <h1>❤️ Jour 14 ❤️ </h1>

  <h2>Aujourd'hui on va faire un petit Quizz d'amour</h2>

  <main>
    <!-- Conteneur quiz -->
    <div id="quizContainer" class="question-box">
      <p class="question" id="question"></p>
      <div class="options" id="options"></div>
      <button id="validateBtn" onclick="validateAnswer()">Valider</button>
      <p class="answer" id="answer"></p>
    </div>

    <!-- Résultat final -->
    <div class="result" id="result">
      <img src="../Images/Dolomites_montagne_us.jpg" alt="Merci">
      <p>Merci d’avoir joué à ce petit quizz <br>
        N'hésite pas à me faire un retour sur les réponses aux questions.<br>
        Peu importe les réponses, la vérité est simple : <br>
        Je t’aime de tout mon cœur ❤️</p>
      <p class="score" id="finalScore"></p>

    </div>
  </main>

  <footer>
    © Mon Album de Souvenirs · Créé avec amour ❤️
  </footer>

  <script>
    // Tableau des questions à choix multiples
    const questions = [
      {
        q: "Où était notre premier baiser ?",
        options: ["Dans la rue", "Dans un parc", "Au cinéma", "Chez toi"],
        correct: 3,
        feedback: "Et oui peut-être pas le meilleure endroit mais j'avais trop peur avant"
      },
      {
        q: "Qui a embrassé l'autre en premier ?",
        options: ["Romane", "Emilien"],
        correct: 1,
        feedback: "Pour une fois que j'ai fait quelque chose en premier"
      },
      {
        q: "Qui a été le plus avenant dans la drague ?",
        options: ["Romane", "Emilien"],
        correct: 0,
        feedback: "J'ai beau ne pas voir les signes je crois que c'était des appels de phare que tu me faisais"
      },
      {
        q: "Qui est le plus amoureux ?",
        options: ["Romane", "Emilien"],
        correct: 1,
        feedback: "Nianiania c'est moi qui t'aime le plus 😝"
      },
      {
        q: "Qui est le plus foufou au lit ?",
        options: ["Romane", "Emilien"],
        correct: 1,
        feedback: "Ah ça je me dénonce, même si tu cache bien ton jeu toi aussi 😏"
      },
      {
        q: "Qui est le plus gourmand ?",
        options: ["Romane", "Emilien"],
        correct: 1,
        feedback: "C’est moi, évidemment je suis un gros sac 😂"
      },
      {
        q: "Quel est notre pays de rêve à visiter ensemble ?",
        options: ["Laponie", "Japon", "Islande", "Etats-Unis", "Île Maurice", "Australie"],
        correct: 1,
        feedback: "J'aurais tendance à dire le Japon même si l'Islande me parait un bon choix aussi"
      },
      {
        q: "Qui est le plus câlin ?",
        options: ["Romane", "Emilien"],
        correct: 1,
        feedback: "Pour une fois je pense que c'est une égalité même si j'adore avoir des câlins"
      },
      {
        q: "Quelle est ma position préférée au lit ?",
        options: ["Cowgirl", "Missionaire", "Levrette", "Cuillère", "Sur une chaise", "69", "Sur le plan de travail", "Masturbation mutuelle"],
        correct: 1,
        feedback: "A choisir je dirais le missionaire, rien de plus basique et pouvoir te regarder dans les yeux est un délice. Mais quand tu me montes en cowgirl est presque à égalité. Je veux tout tester avec toi"
      },
      {
        q: "Quel est notre plat préféré à deux ?",
        options: ["Pizza", "Sushi", "Raclette", "Hamburger"],
        correct: 1,
        feedback: "Les sushis quand même on a un peu de classe"
      },
      {
        q: "Quel est mon rêve ?",
        options: ["Une Mustang", "Finir ma vie avec toi", "Une Ducati", "Une maison", "Etre un bon Papa", "Tous les choix"],
        correct: 5,
        feedback: "Oui tous"
      },
      {
        q: "Qui est le plus romantique ?",
        options: ["Romane", "Emilien"],
        correct: 0,
        feedback: "Tu fais tellement pour moi, je ne peux que dire toi"
      },
      {
        q: "Quelle partie de ton corps me plait le plus ?",
        options: ["Ton nez", "Tes fesses", "Ta bouche", "Tes seins", "Tes yeux", "Tes fossettes", "Ton dos", "Tout"],
        correct: 4,
        feedback: "Si je devais choisir je dirais tes yeux, parce que j'adore la façon que tu as de me regarder, comme ils brillent en me voyant et la couleur qu'ils prennent au soleil"
      },
      {
        q: "Où est-ce que je veux absolument faire l'amour dans ma vie ?",
        options: ["En voiture", "Dans une piscine", "Sur un balcon", "Dans une cabine d'essayage", "En avion", "Au cinéma"],
        correct: 0,
        feedback: "Sns doute le plus basique, je veux faire comme Han de fast and furious"
      },
      {
        q: "Quelle est ma chanson préférée ?",
        options: ["Payphone - Maroon 5", "Clocks - Coldplay", "Numb - Linkin Park", "A Moment Appart - Odesza", "Am I dreaming (Spiderman)", "Fix You - Coldplay"],
        correct: 3,
        feedback: "Je me suis mis dans la merde tout seul c'est impossible de choisir. Je dirais A Moment Appart - Odesza, pour les souvenirs que cette chanson me remémore"
      },
      {
        q: "Quelle est ma couleur préférée ?",
        options: ["Bleu", "Noir", "Vert", "Rouge", "Violet", "Rose"],
        correct: 2,
        feedback: "C'est le vert"
      },
      {
        q: "Qu'est-ce qui me plaît chez toi ?",
        options: ["Ton sourire", "Ton intelligence", "Ta gentillesse", "Ton corps", "Ta façon de réflechir", "Tes passions", "Tout"],
        correct: 6,
        feedback: "Tu me plaîs, pour tout ce que tu es. Je ne peux pas choisir"
      },
      {
        q: "Quelle est notre chanson ?",
        options: ["Perfect – Ed Sheeran", "The emptiness machine – Linkin Park", "When I was your man - Bruno Mars", "Shallow – Lady Gaga", "Marry you - Bruno Mars", "Payphone - Maroon 5"],
        correct: 1,
        feedback: "Emptiness machine ? En vrai je ne sais pas, à toi de me dire"
      },
      {
        q: "Quelle saison je préfère ?",
        options: ["Printemps", "Eté", "Automne", "Hiver"],
        correct: 3,
        feedback: "Ouiiii l'hiver, pour passser mes journées sous le plaid, collé à toi et avec un chocolat chaud pendant qu'il neige dehors"
      },
      {
        q: "Qui a dit 'je t’aime' en premier ?",
        options: ["Romane", "Emilien"],
        correct: 0,
        feedback: "Cette fois encore tu m'as devancé"
      },
      {
        q: "Quel est notre rêve commun ?",
        options: ["Avoir une maison", "Voyager", "Un chien", "Des enfants", "Tout ça à la fois"],
        correct: 4,
        feedback: "Evidemment tout, je veux faire ma vie avec toi"
      }
    ];

    let current = 0;
    let score = 0;

    function showQuestion() {
      if (current < questions.length) {
        const box = document.getElementById("quizContainer");
        box.classList.remove("active"); // cache transition
        setTimeout(() => {
          document.getElementById("question").textContent = questions[current].q;
          const optionsDiv = document.getElementById("options");
          optionsDiv.innerHTML = "";
          questions[current].options.forEach((opt, i) => {
            optionsDiv.innerHTML += `
              <label>
                <input type="radio" name="option" value="${i}"> ${opt}
              </label>
            `;
          });
          document.getElementById("answer").textContent = "";
          document.getElementById("validateBtn").disabled = false;
          setTimeout(() => box.classList.add("active"), 50); // réaffiche
        }, 300);
      } else {
        document.getElementById("quizContainer").style.display = "none";
        document.getElementById("result").style.display = "flex";
        document.getElementById("finalScore").textContent = `Ton score : ${score}/${questions.length} 💕`;
      }
    }

    function validateAnswer() {
      const selected = document.querySelector('input[name="option"]:checked');
      if (!selected) return;

      const answerIndex = parseInt(selected.value);
      const correct = questions[current].correct;

      document.getElementById("validateBtn").disabled = true;

      if (answerIndex === correct) {
        document.getElementById("answer").textContent = "✅ " + questions[current].feedback;
        score++;
      } else {
        document.getElementById("answer").textContent = "❌ " + questions[current].feedback;
      }

      setTimeout(() => {
        current++;
        showQuestion();
      }, 3000);
    }

    // Première question
    showQuestion();
  </script>
</body>

</html>
