<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Album d’Amour</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Georgia", serif;
      background: linear-gradient(135deg, #fdfcfb, #e2d1c3);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* BOUTONS FLOTTANTS (icônes simples) */
    .home-btn,
    .burger {
      position: fixed;
      top: 15px;
      cursor: pointer;
      z-index: 1200;
      text-decoration: none;
      color: #333;
      font-size: 1.8rem;
      font-weight: bold;
      background: none;
      border: none;
      box-shadow: none;
    }

    .home-btn {
      left: 15px;
    }

    .burger {
      right: 15px;
      font-size: 2rem;
    }

    /* MENU BURGER */
    nav {
      position: fixed;
      top: 0;
      right: -260px;
      /* caché par défaut */
      width: 260px;
      height: 100%;
      background: rgba(255, 255, 255, 0.85);
      /* translucide */
      box-shadow: -2px 0 6px rgba(0, 0, 0, 0.2);
      padding: 2rem 1rem;
      transition: right 0.3s ease;
      z-index: 1100;
      visibility: hidden;
    }

    nav.active {
      right: 0;
      visibility: visible;
    }

    nav h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.2rem;
      margin-bottom: 1rem;
      color: #444;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    nav ul li {
      margin: 1rem 0;
      font-size: 1.1rem;
    }

    nav ul li a {
      text-decoration: none;
      font-size: 1.1rem;
      color: #444;
    }

    nav select {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 0.5rem;
    }

    /* CONTENU ACCUEIL */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      font-size: 1rem;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.5rem;
      color: #2d2d2d;
      margin-bottom: 1rem;
    }

    .day-selector {
      margin-top: 2rem;
    }

    .day-selector select {
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      color: #333;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      appearance: none;
      outline: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .day-selector select:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: #666;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.7);
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>
  <!-- Bouton Home -->
  <a href="home.html" class="home-btn">🏠</a>

  <!-- Bouton Burger -->
  <div class="burger" onclick="toggleMenu()">☰</div>

  <!-- MENU BURGER -->
  <nav id="menu">
    <h2>Menu</h2>
    <ul>
      <!-- <p>Choisis le jour que tu voudrais voir</p> -->
      <li>
        <label for="daysBurger">📖 Choisis un jour :</label>
        <select id="daysBurger" onchange="goToDay(this.value)">
          <option value="">-- Sélectionner --</option>
          <option value="22.html">Jour 1</option>
          <option value="23.html">Jour 2</option>
          <option value="24.html">Jour 3</option>
          <option value="25.html">Jour 4</option>
          <option value="26.html">Jour 5</option>
          <option value="27.html">Jour 6</option>
          <option value="28.html">Jour 7</option>
          <option value="29.html">Jour 8</option>
          <option value="30.html">Jour 9</option>
          <option value="1.html">Jour 10</option>
          <option value="2.html">Jour 11</option>
          <option value="3.html">Jour 12</option>
          <option value="4.html">Jour 13</option>
          <option value="5.html">Jour 14</option>
          <option value="6.html">Jour 15</option>
          <option value="7.html">Jour 16</option>
          <option value="8.html">Jour 17</option>
          <option value="9.html">Jour 18</option>
        </select>
      </li>
    </ul>
  </nav>

  <!-- CONTENU -->
  <main>
    <h1>❤️ Bienvenue ❤️ <br> sur ton site d’Amour </h1>
    <p>Quel souvenir veux tu revoir aujourd'hui ?</p>

    <div class="day-selector">
      <label for="daysMain">📖 Accéder à un jour :</label><br>
      <select id="daysMain" onchange="goToDay(this.value)">
        <option value="">-- Choisir un jour --</option>
          <option value="22.html">Jour 1</option>
          <option value="23.html">Jour 2</option>
          <option value="24.html">Jour 3</option>
          <option value="25.html">Jour 4</option>
          <option value="26.html">Jour 5</option>
          <option value="27.html">Jour 6</option>
          <option value="28.html">Jour 7</option>
          <option value="29.html">Jour 8</option>
          <option value="30.html">Jour 9</option>
          <option value="1.html">Jour 10</option>
          <option value="2.html">Jour 11</option>
          <option value="3.html">Jour 12</option>
          <option value="4.html">Jour 13</option>
          <option value="5.html">Jour 14</option>
          <option value="6.html">Jour 15</option>
          <option value="7.html">Jour 16</option>
          <option value="8.html">Jour 17</option>
          <option value="9.html">Jour 18</option>
      </select>
    </div>
  </main>

  <footer>
    © Mon Album de Souvenirs · Créé avec amour ❤️
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById("menu").classList.toggle("active");
    }

    function goToDay(page) {
      if (page) window.location.href = page;
    }
  </script>
</body>

</html>
