<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <title>Album - Jour 18</title>

    <link rel="stylesheet" href="../styles/nav_fleches.css">
    <link rel="stylesheet" href="../styles/polaroid.css">
    <link rel="stylesheet" href="../styles/footer.css">

    <style>
        .polaroid {
            text-align: left;
            line-height: 1.6;
            font-size: 1rem;
            font-family: "Georgia", serif;
            color: #444;
        }
    </style>
</head>

<body>
    <h1>❤️ Jour 18 ❤️ </h1>

    <main>
        <!-- /* Navigation flèches */  -->
        <!-- <div class="fleche left" onclick="prevPhoto()">&#10094;</div>
        <div class="fleche right" onclick="nextPhoto()">&#10095;</div> -->
        <!-- A enlever avant de publier -->

        <p class="quote top" id="quoteTop"></p>

        <div class="polaroid" id="photoContainer">
            <div id="mediaContainer"></div>

            <p class="caption" id="caption"></p>
        </div>

        <p class="quote bottom" id="quoteBottom">⬅️Swipe pour découvrir d’autres souvenirs➡️</p>
    </main>

    <footer>© Mon Album de Souvenirs · Créé avec amour ❤️</footer>

    <script>
        updatePhoto();

        const photos = [
            {
                type: "text",
                src: "",
                top: "",
                content: `
                    <p> Et voila aujourd'hui ton voyage aux Etats-Unis touche à sa fin. <br>
                        Ce qui veut dire aussi que cette page est la dernière de ce site.</p>
                    <p> J’espère que m’avoir à tes côtés durant tout ce voyage t’aura apporté le sourire, donné de la force et surtout aidé à patienter jusqu’à nos retrouvailles.</p>
                    <p> J’espère avoir pu t’apporter de la joie, fait oublier la fatigue et avoir rendu le décalage horaire moins difficile à survivre.</p>
                    `,
                caption: "Pour moi faire ce site a été un moyen de penser à toi chaque jour et me remémorer tous les bons souvenirs qu’on a pu avoir ensemble.",
                bottom: "⬅️Swipe pour lire la suite➡️"
            },
            {
                type: "text",
                src: "",
                top: "",
                content: `
                    <p>
                        Il y a eu des moments plus difficiles que d’autres et je n’étais pas toujours motivé ou inspiré pour continuer. 
                        Mais ça a été un plaisir de réaliser ce site pour toi, en sachant que je te ferai esquisser un sourire ou possiblement une larme.
                    </p>
                    <p>
                        Également, j’ai aimé être occupé sur ce projet et ça m’a fait du bien. 
                        J’ai pu prendre du temps pour moi et je me rends compte de l’importance de penser à soi. 
                    </p>
                    <p>
                        Bien que je ne pense pas avoir réussi à vaincre mes penchants les plus déviants et difficiles, je sens bien qu’il faut que je continu sur cette lancée. 
                    </p>
                    `,
                caption: "En plus, maintenant que je sais que je vais rentrer, je suis encore plus motivé.",
                bottom: "⬅️Swipe pour lire la suite➡️"
            },
            {
                type: "text",
                src: "",
                top: "",
                content: `
                    <p>
                        Mais ça suffit, je ne veux plus être seul et ne veux plus te lâcher une seule seconde maintenant. <br>
                        Je vais essayer de penser plus à moi, je te le promets. 
                        Je veux évoluer pour nous et être le meilleur petit copain pour la meilleure des copines. 
                    </p>
                    <p>
                        Maintenant je veux juste être un gros canard avec ma chérie, et penser rien qu’à toi pendant quelques semaines. <br>
                        Je veux retrouver ton odeur dans mon lit, ta chaleur dans mes bras, tes cheveux sur mes vêtements, ta petite bouille pour la couvrir de bisous. 
                    </p>
                    `,
                caption: "Ton absence m’a confirmé une chose, je suis amoureux de toi et je veux être avec toi pour toujours.",
                bottom: "⬅️Swipe pour lire la suite➡️"
            },
            {
                type: "text",
                src: "",
                top: "",
                content: `
                    <p>
                        Il ne reste plus que quelques heures pour toi jusqu’à ce que tu rentres, ton vol en avion va être long mais chaque minute te rapprochera de moi.
                    </p>
                    <p>Je te souhaite de passer un bon vol retour et je suis impatient de te revoir.</p>
                    <p>Il faudra malheureusement attendre jusqu’à vendredi encore pour pouvoir te serrer dans mes bras. Je suis tellement impatient !</p>
                    `,
                caption: "Je t'aime de tout mon coeur Romane ❤️, tu es un ange venu pour me rendre meilleur, ma reine qui à trouvé son roi, mon petit chou tout mignon.",
                bottom: "⬅️Swipe pour lire la suite➡️"
            },
            {
                type: "img",
                src: "../Images/Costume_mariage_us.jpg",
                top: "",
                caption: "Une dernière photo pour la route ❤️",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            }
        ];

        let current = 0;

        function updatePhoto() {
            const photoContainer = document.getElementById("photoContainer");
            const mediaContainer = document.getElementById("mediaContainer");

            photoContainer.classList.add("fade-out");

            setTimeout(() => {
                // Génère soit une image soit une vidéo
                if (photos[current].type === "img") {
                    mediaContainer.innerHTML = `<img src="${photos[current].src}" alt="Souvenir">`;
                } else if (photos[current].type === "video") {
                    mediaContainer.innerHTML = `
                        <video controls autoplay muted loop>
                            <source src="${photos[current].src}" type="video/mp4">
                            Ton navigateur ne supporte pas la vidéo.
                        </video>
                    `;
                }
                else if (photos[current].type === "text") {
                    mediaContainer.innerHTML = photos[current].content;
                    // photoContainer.classList.add("hidden");
                }

                document.getElementById("quoteTop").textContent = photos[current].top;
                document.getElementById("quoteBottom").textContent = photos[current].bottom;
                document.getElementById("caption").textContent = photos[current].caption;

                photoContainer.classList.remove("fade-out");
            }, 400);
        }



        // Gestion du swipe
        const photoContainer = document.getElementById("photoContainer");
        let startX = 0;

        photoContainer.addEventListener("touchstart", (e) => {
            startX = e.touches[0].clientX;
        });

        photoContainer.addEventListener("touchend", (e) => {
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;

            if (Math.abs(diff) > 50) { // seuil de swipe
                if (diff > 0) {
                    // swipe gauche → photo suivante
                    current = (current + 1) % photos.length;
                } else {
                    // swipe droite → photo précédente
                    current = (current - 1 + photos.length) % photos.length;
                }
                updatePhoto();
            }
        });
    </script>

    <script type="text/javascript" src="../scripts/nav_fleches.js"></script>

</body>

</html>
