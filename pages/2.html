<body>

    <footer>© Mon Album de Souvenirs · Créé avec amour ❤️</footer>

    <script>
        updatePhoto();

        const photos = [
            {
                type: "img",
                src: "../Images/Balade_Donon_vue.jpg",
                top: "Juste après qu'on ai officialisé notre relation, on s'est mis à se montrer plus",
                caption: "Notre première sortie publique en amoureux",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            },
            {
                type: "img",
                src: "../Images/Balade_Donon_groupe.jpg",
                top: "On était avec tous tes potes du crossfit",
                caption: "J'étais shy",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            },
            {
                type: "img",
                src: "../Images/Balade_Donon.jpg",
                top: "",
                caption: "Mais trop heureux avec toi",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            },
            {
                type: "img",
                src: "../Images/FAV_us.jpg",
                top: "",
                caption: "On est allé à la FAV aussi",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            },
            {
                type: "img",
                src: "../Images/FAV_trio.jpg",
                top: "",
                caption: "Le trio de choc",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            },
            {
                type: "img",
                src: "../Images/FAV_trio_rire.jpg",
                top: "Toujours en train de rire",
                caption: "Et ton dos 🥵",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            },
            {
                type: "img",
                src: "../Images/FAV_groupe.jpg",
                top: "",
                caption: "Quelle expérience pour moi, une première encore",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            },
            {
                type: "img",
                src: "../Images/FAV_kiss.jpg",
                top: "",
                caption: "Trop heureux, j'avais reçu un bisous de ma chérie",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            },
            {
                type: "img",
                src: "../Images/FAV_sleep.jpg",
                top: "",
                caption: "Mais je crois que tu me fatigues 😘",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            },
            {
                type: "img",
                src: "../Images/Parapente_groupe.jpg",
                top: "",
                caption: "On a aussi emmené Auguste faire du parapente",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            },
            {
                type: "img",
                src: "../Images/ile_de_re_groupe.jpg",
                top: "Je trouve pas de photos avec mes copains",
                caption: "Mais je suis trop heureux que tu les connaisses tous",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            },
            {
                type: "img",
                src: "../Images/FAV_us2.jpg",
                top: "",
                caption: "Je suis si heureux de pouvoir m'afficher à tes côtés et que tu rencontres tous mes copains",
                bottom: "⬅️Swipe pour découvrir d’autres souvenirs➡️"
            }
        ];

        let current = 0;

        function updatePhoto() {
            const photoContainer = document.getElementById("photoContainer");
            const mediaContainer = document.getElementById("mediaContainer");

            photoContainer.classList.add("fade-out");

            setTimeout(() => {
                // Génère soit une image soit une vidéo
                if (photos[current].type === "img") {
                    mediaContainer.innerHTML = `<img src="${photos[current].src}" alt="Souvenir">`;
                } else if (photos[current].type === "video") {
                    mediaContainer.innerHTML = `
                        <video controls autoplay muted loop>
                            <source src="${photos[current].src}" type="video/mp4">
                            Ton navigateur ne supporte pas la vidéo.
                        </video>
                    `;
                }

                document.getElementById("quoteTop").textContent = photos[current].top;
                document.getElementById("quoteBottom").textContent = photos[current].bottom;
                document.getElementById("caption").textContent = photos[current].caption;

                photoContainer.classList.remove("fade-out");
            }, 400);
        }



        // Gestion du swipe
        const photoContainer = document.getElementById("photoContainer");
        let startX = 0;

        photoContainer.addEventListener("touchstart", (e) => {
            startX = e.touches[0].clientX;
        });

        photoContainer.addEventListener("touchend", (e) => {
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;

            if (Math.abs(diff) > 50) { // seuil de swipe
                if (diff > 0) {
                    // swipe gauche → photo suivante
                    current = (current + 1) % photos.length;
                } else {
                    // swipe droite → photo précédente
                    current = (current - 1 + photos.length) % photos.length;
                }
                updatePhoto();
            }
        });
    </script>

    <script type="text/javascript" src="../scripts/nav_fleches.js"></script>

</body>
