<!-- Accueil premier essai -->

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏠 Mon Album d’Amour</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Georgia", serif;
      background: linear-gradient(135deg, #fdfcfb, #e2d1c3);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.7);
      padding: 0.5rem 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 1000;
    }

    header .home-btn {
      font-size: 1.2rem;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }

    /* MENU BURGER */
    .burger {
      font-size: 2rem;
      cursor: pointer;
      user-select: none;
    }

    nav {
      position: fixed;
      top: 0;
      right: -250px;
      width: 250px;
      height: 100%;
      background: #fff;
      box-shadow: -2px 0 6px rgba(0,0,0,0.1);
      padding: 2rem 1rem;
      transition: right 0.3s ease;
    }

    nav.active {
      right: 0;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    nav ul li {
      margin: 1rem 0;
    }

    nav ul li a {
      text-decoration: none;
      font-size: 1.1rem;
      color: #444;
    }

    /* CONTENU ACCUEIL */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      margin-top: 3rem;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.5rem;
      color: #2d2d2d;
      margin-bottom: 1rem;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
      max-width: 600px;
      width: 100%;
      margin-top: 2rem;
    }

    .links a {
      display: block;
      text-decoration: none;
      background: rgba(255,255,255,0.8);
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      color: #333;
      font-weight: bold;
      transition: transform 0.2s, background 0.2s;
    }

    .links a:hover {
      transform: scale(1.05);
      background: #f3e1d6;
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: #666;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.7);
      border-top: 1px solid rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <a href="index.html" class="home-btn">🏠 Home</a>
    <div class="burger" onclick="toggleMenu()">☰</div>
  </header>

  <!-- MENU BURGER -->
  <nav id="menu">
    <ul>
      <li><a href="jour1.html">Jour 1</a></li>
      <li><a href="jour2.html">Jour 2</a></li>
      <li><a href="jour3.html">Jour 3</a></li>
      <li><a href="jour4.html">Jour 4</a></li>
      <li><a href="jour5.html">Jour 5</a></li>
      <li><a href="jour6.html">Jour 6</a></li>
      <li><a href="quizz.html">💖 Quizz d’Amour</a></li>
    </ul>
  </nav>

  <!-- CONTENU -->
  <main>
    <h1>Bienvenue dans notre Album d’Amour 💕</h1>
    <p>Sélectionne un jour pour revivre nos plus beaux souvenirs.</p>

    <div class="links">
      <a href="jour1.html">Jour 1</a>
      <a href="jour2.html">Jour 2</a>
      <a href="jour3.html">Jour 3</a>
      <a href="jour4.html">Jour 4</a>
      <a href="jour5.html">Jour 5</a>
      <a href="jour6.html">Jour 6</a>
      <a href="quizz.html">💖 Quizz d’Amour</a>
    </div>
  </main>

  <footer>
    © Mon Album de Souvenirs · Créé avec amour ❤️
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById("menu").classList.toggle("active");
    }
  </script>
</body>
</html>
